task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 11
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: <local>/COCO/train
    ann_file: <local>/train/_annotations.coco.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 384
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 1.0
        fill_value: 0
        use_cache: false
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 960
        - 960
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 4
        - 49
        - 90
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 0.5
  shuffle: true
  num_workers: 4
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 960
    base_size_repeat: 6
    stop_epoch: 90
    ema_restart_decay: 0.9999
    mixup_prob: 0.5
    mixup_epochs:
    - 4
    - 49
  total_batch_size: 6
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: <local>/COCO/valid
    ann_file: <local>/valid/_annotations.coco.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 960
        - 960
      - type: ConvertPILImage
        dtype: float32
        scale: true
  shuffle: false
  num_workers: 4
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 6
print_freq: 100
output_dir: ./outputs/rtv4_hgnetv2_m_visdrone_960
checkpoint_freq: 6
sync_bn: true
find_unused_parameters: false
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
epoches: 102
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*bn).*$
    lr: 7.5e-06
  - params: ^(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 7.5e-05
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 500
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
model: RTv4
criterion: RTv4Criterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 960
- 960
RTv4:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 49
no_aug_epoch: 12
HGNetv2:
  pretrained: false
  local_model_dir: ./pretrain/hgnetv2/
  name: B2
  return_idx:
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
HybridEncoder:
  in_channels:
  - 384
  - 768
  - 1536
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 1.0
  depth_mult: 0.67
  act: silu
  distill_teacher_dim: 768
DFINETransformer:
  feat_channels:
  - 256
  - 256
  - 256
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 3
  - 6
  - 3
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu
PostProcessor:
  num_top_queries: 300
RTv4Criterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mal: 1
    loss_distill: 5
  losses:
  - mal
  - boxes
  - local
  - distill
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
  distill_adaptive_params:
    enabled: true
    rho: 3.5
    delta: 0.25
    default_weight: 15
teacher_model:
  type: DINOv3TeacherModel
  dinov3_repo_path: dinov3/
  dinov3_weights_path: pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
  dinov3_model_type: dinov3_vitb16
  patch_size: 16
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
resume: null
